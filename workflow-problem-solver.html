<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Template System - Problem Solver</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --bg-dark: #0f172a;
            --bg-darker: #020617;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --border: #334155;
            --glow: rgba(59, 130, 246, 0.3);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-darker);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        .app-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            height: 100vh;
            max-width: 100vw;
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg-dark);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
        }

        .sidebar-header h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
            color: white;
        }

        .sidebar-header p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
        }

        .problem-list {
            flex: 1;
            padding: 12px;
        }

        .problem-item {
            padding: 16px;
            margin-bottom: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .problem-item:hover {
            border-color: var(--primary);
            transform: translateX(4px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
        }

        .problem-item.active {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(37, 99, 235, 0.1));
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--glow);
        }

        .problem-item.completed::before {
            content: "✓";
            position: absolute;
            right: 16px;
            top: 16px;
            color: var(--success);
            font-weight: bold;
            font-size: 18px;
        }

        .problem-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .problem-difficulty {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .difficulty-badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .difficulty-medium {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .difficulty-hard {
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
        }

        /* Main Content */
        .main-content {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            background: var(--bg-dark);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .problem-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .progress-bar {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .progress-text {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .progress-track {
            width: 200px;
            height: 8px;
            background: var(--bg-card);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--success));
            transition: width 0.3s ease;
        }

        /* Split View */
        .split-view {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            overflow: hidden;
        }

        .panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 12px 20px;
            background: var(--bg-dark);
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: var(--bg-darker);
        }

        .description-content {
            max-width: 800px;
        }

        .description-content h3 {
            font-size: 18px;
            margin: 24px 0 12px 0;
            color: var(--text-primary);
        }

        .description-content h4 {
            font-size: 16px;
            margin: 20px 0 10px 0;
            color: var(--primary);
        }

        .description-content p {
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .description-content ul, .description-content ol {
            margin: 12px 0 12px 24px;
            line-height: 1.8;
            color: var(--text-secondary);
        }

        .description-content pre {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            margin: 12px 0;
            font-size: 13px;
            line-height: 1.5;
        }

        .description-content code {
            background: var(--bg-card);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
            color: var(--primary);
        }

        .description-content pre code {
            background: transparent;
            padding: 0;
        }

        /* Code Editor Panel */
        .editor-panel {
            border-left: 1px solid var(--border);
        }

        .CodeMirror {
            height: 100%;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Action Bar */
        .action-bar {
            padding: 12px 20px;
            background: var(--bg-dark);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.1);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
        }

        /* Console */
        .console {
            background: var(--bg-dark);
            border-top: 1px solid var(--border);
            max-height: 200px;
            overflow-y: auto;
        }

        .console-header {
            padding: 8px 20px;
            background: var(--bg-darker);
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .console-content {
            padding: 12px 20px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .console-line {
            margin-bottom: 4px;
        }

        .console-error {
            color: var(--error);
        }

        .console-success {
            color: var(--success);
        }

        .console-info {
            color: var(--primary);
        }

        /* Hints */
        details {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            margin: 12px 0;
            cursor: pointer;
        }

        details summary {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 8px;
        }

        details[open] summary {
            margin-bottom: 12px;
        }

        /* Animations */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .panel-content > * {
            animation: slideIn 0.3s ease;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-darker);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg-card);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .app-container {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                display: none;
            }
            
            .split-view {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>🚀 Workflow Template System</h1>
                <p>Master template validation & parsing</p>
            </div>
            <div class="problem-list" id="problemList"></div>
        </div>

        <!-- Main Content -->

                    <div class="progress-track">
                        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <div class="split-view">
                <!-- Description Panel -->

                    <div class="panel-header">📋 Problem Description</div>

                <!-- Editor Panel -->
                <div class="panel editor-panel">
                    <div class="panel-header">💻 Your Solution</div>
                    <div class="panel-content" style="padding: 0;">
                        <textarea id="codeEditor"></textarea>
                    </div>
                </div>
            </div>

            <div class="console" id="console" style="display: none;">
                <div class="console-header">Console Output</div>
                <div class="console-content" id="consoleContent"></div>
            </div>

            <div class="action-bar">
                <button class="btn btn-secondary" onclick="resetCode()">Reset Code</button>
                <button class="btn btn-primary" onclick="runTests()">▶ Run Tests</button>
                <button class="btn btn-success" onclick="submitSolution()">✓ Submit Solution</button>
            </div>
        </div>
    </div>

        // State
        let currentProblemIndex = 0;

        let editor;

        // Initialize CodeMirror
        function initEditor() {
            editor = CodeMirror.fromTextArea(document.getElementById('codeEditor'), {
                mode: 'javascript',
                theme: 'monokai',
                lineNumbers: true,
                indentUnit: 2,
                tabSize: 2,
                lineWrapping: true,
                matchBrackets: true,
                autoCloseBrackets: true
            });
        }

        // Render problem list
        function renderProblemList() {
            const problemList = document.getElementById('problemList');
            problemList.innerHTML = problems.map((problem, index) => `
                <div class="problem-item ${index === currentProblemIndex ? 'active' : ''} ${completedProblems.has(problem.id) ? 'completed' : ''}" 
                     onclick="selectProblem(${index})">
                    <div class="problem-title">${problem.title}</div>
                    <div class="problem-difficulty">
                        <span class="difficulty-badge difficulty-${problem.difficulty}">${problem.difficulty}</span>
                    </div>
                </div>
            `).join('');
        }

        // Select problem
        function selectProblem(index) {
            currentProblemIndex = index;
            const problem = problems[index];
            
            document.getElementById('currentProblemTitle').textContent = problem.title;
            document.getElementById('problemDescription').innerHTML = problem.description;
            editor.setValue(problem.starterCode);
            
            renderProblemList();
            hideConsole();
        }

        // Update progress
        function updateProgress() {
            const completed = completedProblems.size;
            const total = problems.length;
            const percentage = (completed / total) * 100;
            
            document.getElementById('progressText').textContent = `${completed} / ${total} completed`;
            document.getElementById('progressFill').style.width = `${percentage}%`;
        }

        // Console functions
        function showConsole() {
            document.getElementById('console').style.display = 'block';
        }

        function hideConsole() {
            document.getElementById('console').style.display = 'none';
        }

        function clearConsole() {
            document.getElementById('consoleContent').innerHTML = '';
        }

        function logToConsole(message, type = 'info') {
            const consoleContent = document.getElementById('consoleContent');
            const line = document.createElement('div');
            line.className = `console-line console-${type}`;
            line.textContent = message;
            consoleContent.appendChild(line);
            showConsole();
        }

        // Run tests
        function runTests() {
            clearConsole();
            const problem = problems[currentProblemIndex];
            const userCode = editor.getValue();
            
            logToConsole('Running tests...', 'info');
            
            try {
                // Execute user code
                eval(userCode);
                
                let passedTests = 0;
                
                // Run each test
                problem.tests.forEach((test, index) => {
                    try {
                        const result = eval(test.input);
                        const passed = JSON.stringify(result) === JSON.stringify(test.expected);
                        
                        if (passed) {
                            logToConsole(`✓ Test ${index + 1}: PASSED`, 'success');
                            passedTests++;
                        } else {
                            logToConsole(`✗ Test ${index + 1}: FAILED`, 'error');
                            logToConsole(`  Expected: ${JSON.stringify(test.expected)}`, 'info');
                            logToConsole(`  Got: ${JSON.stringify(result)}`, 'info');
                        }
                    } catch (err) {
                        logToConsole(`✗ Test ${index + 1}: ERROR - ${err.message}`, 'error');
                    }
                });
                
                logToConsole(`\n${passedTests} / ${problem.tests.length} tests passed`, passedTests === problem.tests.length ? 'success' : 'error');
                
            } catch (err) {
                logToConsole(`Syntax Error: ${err.message}`, 'error');
            }
        }

        // Submit solution
        function submitSolution() {
            const problem = problems[currentProblemIndex];
            const userCode = editor.getValue();
            
            clearConsole();
            logToConsole('Submitting solution...', 'info');
            
            try {
                eval(userCode);
                
                let allPassed = true;
                
                problem.tests.forEach((test, index) => {
                    try {
                        const result = eval(test.input);
                        const passed = JSON.stringify(result) === JSON.stringify(test.expected);
                        if (!passed) {
                            allPassed = false;
                        }
                    } catch (err) {
                        allPassed = false;
                    }
                });
                
                if (allPassed) {
                    completedProblems.add(problem.id);
                    logToConsole('🎉 Congratulations! All tests passed!', 'success');
                    logToConsole('Solution accepted. Moving to next problem...', 'success');
                    updateProgress();
                    renderProblemList();
                    
                    setTimeout(() => {
                        if (currentProblemIndex < problems.length - 1) {
                            selectProblem(currentProblemIndex + 1);
                        } else {
                            logToConsole('\n🏆 You completed all problems! Excellent work!', 'success');
                        }
                    }, 2000);
                } else {
                    logToConsole('Some tests failed. Please fix your solution.', 'error');
                    runTests();
                }
                
            } catch (err) {
                logToConsole(`Syntax Error: ${err.message}`, 'error');
            }
        }

        // Reset code
        function resetCode() {
            const problem = problems[currentProblemIndex];
            editor.setValue(problem.starterCode);
            clearConsole();
            hideConsole();
        }

        // Initialize
        window.onload = function() {
            initEditor();
            renderProblemList();
            selectProblem(0);
            updateProgress();
        };
    </script>
</body>
</html>
